<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<!-- maximum-scale + user-scalable: iOS nie ma przybliżać widoku po tapnięciu w pole -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SwimApp</title>
<meta name="description" content="Log treningów pływackich: tracker splitów, plan treningowy i historia sesji.">
<meta name="theme-color" content="#0a1d42">
<meta name="color-scheme" content="dark">
<!-- iOS: pełny ekran po dodaniu do ekranu głównego -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SwimApp">
<!-- Ikony: apple-touch-icon trafia na ekran początkowy iPhone'a (Design/SwimApp-assets) -->
<link rel="apple-touch-icon" sizes="180x180" href="icon/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon/icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icon/icon-120.png">
<link rel="icon" type="image/png" sizes="1024x1024" href="icon/icon-1024.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ?v= wymusza pobranie nowej wersji po deployu (GitHub Pages cachuje agresywnie).
     Przy podbiciu wersji zmień numer TU i w js/wersja.js — patrz CLAUDE.md. -->
<link rel="stylesheet" href="css/style.css?v=0.9.7">
</head>
<body>
<!-- Ekran startowy (Design/SwimApp-assets/splash.html) — chowany przez js/app.js -->
<div id="splash" class="splash">
  <div class="splash-mark">
    <svg width="130" height="103" viewBox="0 0 38 30" fill="none" aria-label="SwimApp">
      <path d="M2 8 Q10 2, 18 8 T34 8" stroke="oklch(0.9 0.02 230)" stroke-width="4.6" stroke-linecap="round"/>
      <path d="M2 16 Q10 10, 18 16 T34 16" stroke="var(--accent-info)" stroke-width="4.6" stroke-linecap="round"/>
      <path d="M2 24 Q10 18, 18 24 T34 24" stroke="var(--accent-confirm)" stroke-width="4.6" stroke-linecap="round"/>
    </svg>
    <!-- pastylki startują wygaszone, zapala je po kolei js/app.js -->
    <div class="splash-bar"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="splash-wordmark"><span class="w-swim">Swim</span><span class="w-app">App</span></div>
</div>

<!-- Widok poziomy na telefonie: iOS nie pozwala zablokować rotacji poza trybem
     pełnoekranowym, więc zamiast rozjechanego układu pokazujemy komunikat. -->
<div class="rotate-lock" id="rotateLock">
  <svg width="90" height="71" viewBox="0 0 38 30" fill="none" aria-hidden="true">
    <path d="M2 8 Q10 2, 18 8 T34 8" stroke="oklch(0.9 0.02 230)" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M2 16 Q10 10, 18 16 T34 16" stroke="var(--accent-info)" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M2 24 Q10 18, 18 24 T34 24" stroke="var(--accent-confirm)" stroke-width="4.6" stroke-linecap="round"/>
  </svg>
  <div class="rotate-lock-title">Brak widoku poziomego</div>
  <div class="rotate-lock-desc">Obróć telefon pionowo</div>
</div>

<header class="app-header">
  <div class="app-header-inner">
    <div class="app-header-top">
      <div class="logo">
        <svg width="26" height="21" viewBox="0 0 38 30" aria-label="SwimApp">
          <path d="M2 8 Q10 2, 18 8 T34 8" fill="none" stroke="oklch(0.9 0.02 230)" stroke-width="4" stroke-linecap="round"/>
          <path d="M2 16 Q10 10, 18 16 T34 16" fill="none" stroke="var(--accent-info)" stroke-width="4" stroke-linecap="round"/>
          <path d="M2 24 Q10 18, 18 24 T34 24" fill="none" stroke="var(--accent-confirm)" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span class="wordmark"><span class="w-swim">Swim</span><span class="w-app">App</span></span>
      </div>
      <span class="ver-badge" id="wersja"></span>
    </div>
    <div class="nav-shell">
      <nav id="nawigacja" class="navrow"></nav>
      <button type="button" id="ustawieniaBtn" class="gear-btn" aria-label="Ustawienia" title="Ustawienia">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </div>
</header>

<main id="widok"></main>

<script src="js/wersja.js?v=0.9.7"></script>
<script src="js/app.js?v=0.9.7"></script>
<script src="js/dane.js?v=0.9.7"></script>
<script src="js/model.js?v=0.9.7"></script>
<script src="js/keypad.js?v=0.9.7"></script>
<script src="js/plan.js?v=0.9.7"></script>
<script src="js/sesja-tabela.js?v=0.9.7"></script>
<script src="js/tracker.js?v=0.9.7"></script>
<script src="js/plan-widok.js?v=0.9.7"></script>
<script src="js/historia.js?v=0.9.7"></script>
<script src="js/ustawienia.js?v=0.9.7"></script>
</body>
</html>
